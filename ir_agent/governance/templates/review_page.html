<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--muted:#5d6675;--line:#d9dde4;--accent:#2457c5;
--ok:#1f7a45;--ng:#b42318;--warn:#a15c00;--warnbg:#fff4e0;--code:#f1f3f6;--sel:#eaf0ff}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--ink:#e6e9ef;--muted:#9aa3b2;
--line:#333a45;--accent:#7aa2ff;--ok:#5cc58a;--ng:#ff7b72;--warn:#f0b35a;--warnbg:#3a2c12;--code:#262b33;--sel:#22304d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.65 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}
footer{position:sticky;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:10px 16px}
h1{font-size:17px;margin:0 0 8px}.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.bar{flex:1 1 220px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);width:0}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 14px;overflow:hidden}
.card.att{border-left:5px solid var(--warn)}.card.done{opacity:.92}.card.selected{background:var(--sel)}
.head{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.head h2{font-size:15px;margin:0;word-break:break-all;flex:1}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;margin:2px 4px 0 0;
background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
.state{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.state.ok{color:var(--ok);border-color:var(--ok)}.state.ng{color:var(--ng);border-color:var(--ng)}
.body{padding:4px 14px 8px}.body h4{font-size:13px;color:var(--muted);margin:12px 0 2px}
.body p,.body ul{margin:2px 0}.body code{background:var(--code);padding:1px 4px;border-radius:4px;
white-space:pre-wrap;word-break:break-all;font-size:13px}
details>summary{cursor:pointer;color:var(--accent);padding:0 14px 8px;font-size:13px}
.decide{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;padding:12px 14px;background:var(--bg);border-top:1px solid var(--line)}
.decide label{font-size:13px;color:var(--muted);padding-top:6px}
select,input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);
border:1px solid var(--line);border-radius:6px;padding:6px 8px}textarea{min-height:56px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.note{font-size:13px;color:var(--muted)}.hidden{display:none!important}
#msg{font-size:13px;color:var(--warn)}
.help{font-size:13px;color:var(--muted);margin-top:4px}
#legend dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;margin:6px 0 0;font-size:13px}
#legend dt{font-weight:600}#legend dd{margin:0;color:var(--muted)}
@media (max-width:640px){.decide{grid-template-columns:1fr}.decide label{padding-top:0}}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="row">
    <label>判定者の ID <input type="text" id="analyst" placeholder="名前またはハンドル" style="width:180px"></label>
  </div>
  <div class="row" style="margin-top:8px">
    <label>表示 <select id="filter" style="width:auto">
      <option value="all">すべて</option><option value="undecided">未判定のみ</option>
      <option value="attention">要注意のみ</option></select></label>
    <span class="note">一括設定(要注意の項目は対象外):</span>
    <button id="selectPlain">要注意以外を選択</button><button id="selectNone">選択解除</button>
    <select id="bulkValue" style="width:auto"></select><button id="bulkApply">選択した項目に設定</button>
  </div>
  <p class="note" style="margin:8px 0 0">必要なのは各項目の「判定」だけです。理由は任意で、空欄なら定型文が記録されます。要注意の項目は詳細を開いた状態で表示し、一括設定の対象外です。1 件ずつ判定してください。</p>
  <details id="legend" class="note" style="margin-top:6px"><summary style="padding:0">判定の選択肢と、それぞれ報告書にどう反映されるか</summary><dl></dl></details>
</header>
<main id="list"></main>
<footer>
  <div class="row">
    <div class="bar" title="判定済みの割合"><i id="bar"></i></div>
    <span id="progress" class="note"></span>
    <button class="primary" id="download">決定をファイルに保存 (JSON)</button>
    <button id="copy">決定をコピー</button><span id="msg"></span>
  </div>
</footer>
__BODIES__
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const KEY='ir-review:'+D.sha256;const UNDECIDED=['','pending','null','none'];
const label=v=>D.labels[v]||v;
const help=(it,v)=>((D.help||{})[it.type]||{})[v]||'';
const field=(it,k)=>it.fields.find(f=>f.key===k);
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const state={analyst:saved.analyst||'',items:{}};
D.items.forEach(it=>{const s=(saved.items||{})[it.id]||{};const v={};
  it.fields.forEach(f=>{v[f.key]=s[f.key]!==undefined?s[f.key]:f.value});state.items[it.id]=v});
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const decided=it=>!UNDECIDED.includes(String(state.items[it.id][it.decisionKey]||'').toLowerCase());
document.getElementById('title').textContent=D.title+' — '+D.document;
const analyst=document.getElementById('analyst');analyst.value=state.analyst;
analyst.oninput=()=>{state.analyst=analyst.value.trim();persist()};
const list=document.getElementById('list');const selected=new Set();
const order=[...D.items].sort((a,b)=>(b.attention.length>0)-(a.attention.length>0));
function el(t,attrs,kids){const e=document.createElement(t);Object.assign(e,attrs||{});(kids||[]).forEach(k=>e.append(k));return e}
function conditional(it,key){const f=field(it,key);if(!f)return null;
  if(key==='edited_claim_text')return'edited';if(key==='downgraded_confidence')return'downgraded';return null}
order.forEach(it=>{
  const card=el('article',{className:'card'+(it.attention.length?' att':'')});card.dataset.id=it.id;
  const cb=el('input',{type:'checkbox',title:'一括設定の対象にする',disabled:it.attention.length>0});
  cb.onchange=()=>{cb.checked?selected.add(it.id):selected.delete(it.id);card.classList.toggle('selected',cb.checked)};
  const badges=el('div');it.attention.forEach(a=>badges.append(el('span',{className:'badge',textContent:a})));
  const stateTag=el('span',{className:'state'});
  card.append(el('div',{className:'head'},[cb,el('div',{style:'flex:1'},[el('h2',{textContent:it.heading}),badges]),stateTag]));
  const body=el('div',{className:'body'});const tpl=document.getElementById('body-'+it.id);
  if(tpl)body.append(tpl.content.cloneNode(true));
  if(it.attention.length){card.append(body)}else{const det=el('details',{},[el('summary',{textContent:'詳細を表示'}),body]);card.append(det)}
  const grid=el('div',{className:'decide'});const dk=field(it,it.decisionKey);
  const sel=el('select');sel.append(el('option',{value:'',textContent:'— 未判定 —'}));
  dk.options.filter(o=>!UNDECIDED.includes(o)).forEach(o=>sel.append(el('option',{value:o,textContent:label(o),title:help(it,o)||o})));
  sel.value=UNDECIDED.includes(String(state.items[it.id][it.decisionKey]).toLowerCase())?'':state.items[it.id][it.decisionKey];
  const helpLine=el('div',{className:'help'});
  grid.append(el('label',{textContent:'判定(必須)'}),el('div',{},[sel,helpLine]));
  const extras=[];
  it.fields.forEach(f=>{if([it.decisionKey,'analyst_id'].includes(f.key))return;
    const isReason=f.key.endsWith('_reason');const lab=isReason?'理由(任意)':(f.key==='edited_claim_text'?'修正後の文言':(f.key==='downgraded_confidence'?'変更後の確度':f.key));
    let input;if(f.options&&f.options.length){input=el('select');input.append(el('option',{value:'',textContent:'—'}));
      f.options.forEach(o=>input.append(el('option',{value:o,textContent:o})))}
    else{input=(isReason||f.key==='edited_claim_text')?el('textarea'):el('input',{type:'text'})}
    input.value=state.items[it.id][f.key]||'';
    if(isReason)input.placeholder='任意。空欄なら定型文(decided via HTML review by 判定者 ID)を記録します';
    input.oninput=input.onchange=()=>{state.items[it.id][f.key]=input.value;persist()};
    const l=el('label',{textContent:lab});grid.append(l,input);extras.push([f.key,l,input])});
  const sync=()=>{const v=sel.value;state.items[it.id][it.decisionKey]=v||(dk.value==='null'?'null':'pending');
    extras.forEach(([k,l,i])=>{const need=conditional(it,k);const hide=need&&v!==need;l.classList.toggle('hidden',hide);i.classList.toggle('hidden',hide)});
    helpLine.textContent=v?help(it,v):'';
    stateTag.textContent=v?label(v):'未判定';stateTag.className='state'+(v?(v==='rejected'?' ng':' ok'):'');
    card.classList.toggle('done',!!v);persist();refresh()};
  sel.onchange=sync;card._sync=()=>{sel.value=state.items[it.id][it.decisionKey]||'';sync()};
  card.append(grid);list.append(card);sel._init=true;setTimeout(sync,0)});
const bulk=document.getElementById('bulkValue');
const allOpts=[...new Set(D.items.flatMap(it=>field(it,it.decisionKey).options))].filter(o=>!UNDECIDED.includes(o));
allOpts.forEach(o=>bulk.append(el('option',{value:o,textContent:label(o)})));
const legend=document.querySelector('#legend dl');const shown=new Set();
D.items.forEach(it=>field(it,it.decisionKey).options.filter(o=>!UNDECIDED.includes(o)).forEach(o=>{
  if(shown.has(o))return;shown.add(o);legend.append(el('dt',{textContent:label(o)}),el('dd',{textContent:help(it,o)||o}))}));
const filter=document.getElementById('filter');
function refresh(){const total=D.items.length,done=D.items.filter(decided).length;
  const att=D.items.filter(i=>i.attention.length),attDone=att.filter(decided).length;
  document.getElementById('bar').style.width=(total?100*done/total:0)+'%';
  document.getElementById('progress').textContent=`判定済み ${done}/${total}(要注意 ${attDone}/${att.length})`;
  list.querySelectorAll('.card').forEach(c=>{const it=D.items.find(i=>i.id===c.dataset.id);
    const f=filter.value;c.classList.toggle('hidden',(f==='undecided'&&decided(it))||(f==='attention'&&!it.attention.length))})}
filter.onchange=refresh;
document.getElementById('selectPlain').onclick=()=>list.querySelectorAll('.card:not(.hidden):not(.att) input[type=checkbox]').forEach(c=>{c.checked=true;c.onchange()});
document.getElementById('selectNone').onclick=()=>list.querySelectorAll('input[type=checkbox]').forEach(c=>{c.checked=false;c.onchange()});
document.getElementById('bulkApply').onclick=()=>{let n=0;selected.forEach(id=>{const it=D.items.find(i=>i.id===id);
  if(it.attention.length||!field(it,it.decisionKey).options.includes(bulk.value))return;
  state.items[id][it.decisionKey]=bulk.value;list.querySelector(`.card[data-id="${CSS.escape(id)}"]`)._sync();n++});
  msg(n+' 件に設定しました')};
function msg(t){const m=document.getElementById('msg');m.textContent=t;setTimeout(()=>{if(m.textContent===t)m.textContent=''},6000)}
function exportData(){if(!state.analyst){msg('判定者の ID を入力してください');analyst.focus();return null}
  const decisions=D.items.filter(decided).map(it=>{const o={item_id:it.id};it.fields.forEach(f=>{if(f.key!=='analyst_id')o[f.key]=state.items[it.id][f.key]});return o});
  const pending=D.items.length-decisions.length;
  if(pending&&!confirm(`未判定が ${pending} 件あります。判定済みの ${decisions.length} 件だけを書き出しますか?`))return null;
  return JSON.stringify({format:D.format,document:D.document,sha256:D.sha256,analyst_id:state.analyst,
    exported_at:new Date().toISOString(),decisions},null,2)}
document.getElementById('download').onclick=()=>{const j=exportData();if(!j)return;
  const a=el('a',{href:URL.createObjectURL(new Blob([j],{type:'application/json'})),download:D.document.replace(/\.md$/,'')+'.decisions.json'});
  document.body.append(a);a.click();a.remove();msg('保存しました。保存したファイルのパスをエージェントに伝えてください')};
document.getElementById('copy').onclick=async()=>{const j=exportData();if(!j)return;
  try{await navigator.clipboard.writeText(j);msg('コピーしました。チャットに貼り付けてください')}catch(e){msg('コピーできませんでした。ファイルに保存してください')}};
})();
</script>
</body>
</html>
